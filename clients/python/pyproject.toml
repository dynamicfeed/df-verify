[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynamicfeed-verify"
version = "1.0.3"
description = "Verify Dynamic Feed DF-VERIFY/1 signature bytes and signing-key lifecycle policy."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Dynamic Feed" }]
keywords = ["dynamic-feed", "ed25519", "verification", "provenance", "attestation", "df-verify", "ai", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
]
dependencies = ["cryptography>=41"]

[project.urls]
Homepage = "https://dynamicfeed.ai"
Standard = "https://dynamicfeed.ai/standard"
Source = "https://github.com/dynamicfeed/df-verify"

[project.scripts]
dynamicfeed-verify = "dynamicfeed_verify.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["dynamicfeed_verify"]
