[package]
name = "dynamicfeed-verify"
version = "1.0.2"
edition = "2021"
description = "Verify Dynamic Feed DF-VERIFY/1 signatures and signing-key lifecycle policy."
license = "MIT"
readme = "README.md"
homepage = "https://dynamicfeed.ai/standard"
repository = "https://github.com/dynamicfeed/df-verify"
keywords = ["ed25519", "signature", "verification", "provenance", "ai"]
categories = ["cryptography", "command-line-utilities"]

[lib]
name = "dynamicfeed_verify"
path = "src/lib.rs"

[[bin]]
name = "dynamicfeed-verify"
path = "src/main.rs"

[dependencies]
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
ureq = { version = "2", optional = true }

[features]
default = []
# Optional networked lifecycle-registry fetching. Core verification is no-network.
fetch = ["dep:ureq"]
